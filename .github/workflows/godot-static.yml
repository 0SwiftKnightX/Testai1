name: Godot 4.7.2 Static Validation

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          curl -L --fail --retry 3             -o godot.zip             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import project
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Validate project
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit-after 2
